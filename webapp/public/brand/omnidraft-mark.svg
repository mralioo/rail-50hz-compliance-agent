<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    OmniDraft mark: two converging rail lines forming a chevron (a track
    switch/frog in plan view), capped by a filled "signal node" circle at
    the apex — reads as a rail signal, a circuit node, and an agent-network
    node at once. Two crossbars = rail sleepers / an abstracted waveform.
    Cyan carries the primary structure; amber is reserved for the base
    crossbar only, matching the app's sparing secondary-accent rule.
  -->
  <path
    d="M10 50 L32 12 L54 50"
    stroke="#29E0FF"
    stroke-width="5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <line x1="15" y1="40" x2="49" y2="40" stroke="#29E0FF" stroke-width="4" stroke-linecap="round" />
  <line x1="10" y1="50" x2="54" y2="50" stroke="#F5B23D" stroke-width="4" stroke-linecap="round" />
  <circle cx="32" cy="12" r="5" fill="#29E0FF" />
</svg>
